name: Code integration source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify the runner's test runtime
        run: node --version
      - name: Check syntax
        run: npm run check
      - name: Check editor and IPC contracts
        run: npm test

# No dependency installation, Codex/model download, real inference, editor
# installation or privileged service startup. These are source/protocol checks.
